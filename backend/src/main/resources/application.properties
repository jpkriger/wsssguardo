spring.application.name=WssSguardo

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}

cognito.region=${COGNITO_REGION:us-east-2}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:placeholder}
cognito.client-id=${COGNITO_CLIENT_ID:placeholder}
cognito.client-secret=${COGNITO_CLIENT_SECRET:placeholder}

auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.show-details=never

# Arquivamento seguro de projetos.
# Chave/cert de assinatura do servidor (keystore PKCS#12) e cert público do cofre (PEM/DER).
# Sem estes valores a aplicação sobe normalmente; apenas o endpoint de arquivar fica indisponível (503).
archive.signing.keystore-path=${ARCHIVE_SIGNING_KEYSTORE_PATH:}
archive.signing.keystore-password=${ARCHIVE_SIGNING_KEYSTORE_PASSWORD:}
archive.signing.key-alias=${ARCHIVE_SIGNING_KEY_ALIAS:}
archive.signing.key-password=${ARCHIVE_SIGNING_KEY_PASSWORD:}
archive.recipient.certificate-path=${ARCHIVE_RECIPIENT_CERTIFICATE_PATH:}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
