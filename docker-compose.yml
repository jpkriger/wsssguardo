services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wssdb
      POSTGRES_USER: wss
      POSTGRES_PASSWORD: wss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wss -d wssdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/wssdb
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: wss
      DB_PASSWORD: wss
      DB_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OTLP_ENABLED: "false"
      SECURITY_AUTH_DISABLED: "true"
      AI_SERVICE_URL: "${AI_SERVICE_URL:-http://localhost:8000}"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - prod

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - prod

  backend-dev:
    build:
      context: ./backend
      target: dev
    working_dir: /workspace
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      DB_URL: jdbc:postgresql://db:5432/wssdb
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: wss
      DB_PASSWORD: wss
      DB_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OTLP_ENABLED: "false"
      SECURITY_AUTH_DISABLED: "${SECURITY_AUTH_DISABLED:-true}"
      AUTH_COOKIE_SECURE: "false"
      AI_SERVICE_URL: "${AI_SERVICE_URL:-http://host.docker.internal:8000}"
      COGNITO_REGION: "${COGNITO_REGION:-us-east-2}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID:-placeholder}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-placeholder}"
      COGNITO_CLIENT_SECRET: "${COGNITO_CLIENT_SECRET:-placeholder}"
      AWS_PROFILE: "${AWS_PROFILE:-wsssguardo}"
      SPRING_LIQUIBASE_CONTEXTS: seed
      # Arquivamento: chaves montadas de ./backend/dev-keys (gere com openssl — ver docs/project-archival.md).
      # A app sobe sem elas; só o endpoint de arquivar fica 503 até os arquivos existirem.
      ARCHIVE_SIGNING_KEYSTORE_PATH: "${ARCHIVE_SIGNING_KEYSTORE_PATH:-/keys/signer.p12}"
      ARCHIVE_SIGNING_KEYSTORE_PASSWORD: "${ARCHIVE_SIGNING_KEYSTORE_PASSWORD:-changeit}"
      ARCHIVE_SIGNING_KEY_ALIAS: "${ARCHIVE_SIGNING_KEY_ALIAS:-archive-signer}"
      ARCHIVE_RECIPIENT_CERTIFICATE_PATH: "${ARCHIVE_RECIPIENT_CERTIFICATE_PATH:-/keys/vault-public.crt}"
    volumes:
      - maven_cache:/root/.m2
      - ~/.aws:/root/.aws:ro
      - ./backend/dev-keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/5005'"]
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 10s
    profiles:
      - dev

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    command: ["sh", "-lc", "bun install && bun run lint && bun run dev --host 0.0.0.0 --port 5173"]
    environment:
      VITE_PROXY_TARGET: http://backend-dev:8080
      VITE_USE_POLLING: "true"
      VITE_POLL_INTERVAL: "250"
      VITE_AUTH_DISABLED: "${VITE_AUTH_DISABLED:-true}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev
    profiles:
      - dev

volumes:
  postgres_data:
  maven_cache:
